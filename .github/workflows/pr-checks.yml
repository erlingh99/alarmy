name: Pull Request Checks

on:
  pull_request:
    branches: [ main ]

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      embedded: ${{ steps.filter.outputs.embedded }}
    steps:
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            workflow: &workflow
              - '.github/workflows/pr-checks.yml'
            backend:
              - *workflow
              - 'backend/**'
            frontend:
              - *workflow
              - 'frontend/**'
            embedded:
              - *workflow
              - 'embedded/Cargo.*'
              - 'embedded/.cargo/**'
              - 'embedded/bootloader/**'
              - 'embedded/firmware/**'
              - 'embedded/memory-layout/**'
              - 'embedded/memory_layout.toml'
              - 'embedded/cyw43-firmware/**'

  backend-checks:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
      - name: Install dependencies
        run: uv sync --locked --group dev
        working-directory: backend
      - name: Type check
        run: uv run ty check
        working-directory: backend
      - name: Lint
        run: uv run ruff check
        working-directory: backend
      - name: Test
        run: uv run pytest
        working-directory: backend

  frontend-checks:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
        working-directory: frontend
      - name: Type check
        run: bun run check
        working-directory: frontend
      - name: Lint
        run: bun run lint
        working-directory: frontend
      - name: Test
        run: bun run test
        working-directory: frontend

  embedded-checks:
    needs: changes
    if: needs.changes.outputs.embedded == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv6m-none-eabi
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            embedded -> target
            embedded/memory-layout -> target
      - name: Check
        run: cargo check --locked
        working-directory: embedded
      - name: Clippy
        run: cargo clippy --locked
        working-directory: embedded
      # Host-only build dependency, excluded from the Pico workspace
      - name: Clippy (memory-layout)
        run: cargo clippy --locked
        working-directory: embedded/memory-layout
